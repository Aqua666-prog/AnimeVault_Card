name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardlegends_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: cardlegends_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardlegends_test -d cardlegends_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cardlegends_test:local_test_only@localhost:5432/cardlegends_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

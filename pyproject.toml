[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cardlegends"
version = "0.2.0"
description = "Фундамент коллекционной Telegram RPG CardLegends"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
cardlegends = "cardlegends.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cardlegends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL 16+ database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel.force-include]
"assets/cards" = "cardlegends/assets/cards"

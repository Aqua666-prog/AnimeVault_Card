services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardlegends_test
      POSTGRES_USER: cardlegends_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardlegends_test -d cardlegends_test"]
      interval: 2s
      timeout: 3s
      retries: 20
